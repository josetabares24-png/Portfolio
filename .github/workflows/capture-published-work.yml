name: Capture published work for portfolio preview

on:
  push:
    branches:
      - preview/portfolio-humanweb-v6-2026-11-03
    paths:
      - .github/workflows/capture-published-work.yml
      - scripts/capture-published-work.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    if: github.repository == 'josetabares24-png/Portfolio'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Capture authenticated-by-source public pages
        run: node scripts/capture-published-work.mjs
      - name: Commit the actual screenshot files to preview only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/showcase-captures
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'assets: capture real desktop and mobile websites [skip ci]'
          git push origin HEAD:preview/portfolio-humanweb-v6-2026-11-03
